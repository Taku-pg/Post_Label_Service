<div class="content-input-field">
    <p class="input-header">Add Package Item</p>
    <form class="add-item-form" [formGroup]="addItemForm">
        <div class="input-item">
            <label for="product-name" class="input-label">Product Name</label>
            <input type="text" placeholder="Enter Product Name" id="product-name" name="product-name"
                class="input-field" required="" formControlName="productName">
        </div>

        <div class="number-inputs">
            <div class="input-item">
                <label for="amount" class="input-label">Amount</label>
                <input type="number" id="amount" name="amount" class="input-field" required="" min="1"
                formControlName="amount">
            </div>

            <div class="input-item">
                <label for="price" class="input-label">Price</label>
                <input type="number" id="price" name="price" class="input-field" required="" min="1"
                formControlName="price">
            </div>

            <div class="input-item">
                <label for="weight" class="input-label">Weight(kg)</label>
                <input type="number" id="weight" name="weight" class="input-field" required="" step="0.001" min="0.001"
                formControlName="weight">
            </div>
        </div>

        <div class="input-item">
            <label for="type-name" class="input-label">Type</label>
            <select id="type-name" name="type-name" class="select-field" required="" formControlName="type">
                <option value="" disabled hidden selected>Select Item Type</option>
                <option value="food">Food</option>
            </select>
        </div>

        <div class="input-item">
            <label for="country-of-origin" class="input-label">Country of Origin</label>
            <input type="text" placeholder="Enter Country of Origin" id="country-of-origin" name="country-of-origin"
                class="input-field" formControlName="countryOfOrigin">
        </div>

        <div class="button-container">
            <button type="button" class="add-button" (click)="onClickAdd()">Add</button>
            <button type="button" class="cancel-button" (click)="onClickCancel()">Cancel</button>
        </div>
    </form>
</div>
