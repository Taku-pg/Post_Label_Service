<div class="confirm-dialog">
    <div class="dialog-header">
        <h3>{{data.title}}</h3>
    </div>
    <div class="dialog-body">
        <h4 class="message">{{data.message}}</h4>
    </div>
    <div class="dialog-footer">
        @if(isOnlyOkDialog){
        <button type="button" class="btn" (click)="onClickOK()">OK</button>
        }@else {
        <button type="button" class="btn" (click)="onClickConfirm()">Confirm</button>
        <button type="button" class="btn" (click)="onClickCancel()">Cancel</button>
        }

    </div>
</div>
