<h2 class="delivery-info-form-title">Delivery Information</h2>

<form [formGroup]="deliveryInfoForm()">
    <div class="form-content">
        <p class="info-header">Sender Information </p>
        <div class="sender-info-name">
            <div class="name-form">
                <label for="first-name" class="name-label">First Name</label>
                <input type="text" placeholder="Enter your First Name" id="first-name" class="input-field" required=""
                    [readOnly]="isReadOnly()" formControlName="firstName">
            </div>

            <div class="name-form">
                <label for="last-name" class="name-label">Last Name</label>
                <input type="text" placeholder="Enter your Last Name" id="last-name" class="input-field" required=""
                    [readOnly]="isReadOnly()" formControlName="lastName">
            </div>
        </div>

        <div class="form-item">
            <label for="compane-name" class="u-label">Company Name </label>
            <input type="text" placeholder="{{isReadOnly() ? '' : 'Company Name'}}" id="company-name"
                class="input-field" [readOnly]="isReadOnly()" formControlName="company">
        </div>

        <div class="form-item">
            <label for="email" class="">Email</label>
            <input type="email" placeholder="Enter a valid email address" id="email" class="input-field" required=""
                [readOnly]="isReadOnly()" formControlName="email">
        </div>


        <div class="form-item">
            <label for="phone" class="u-label">Phone</label>
            <input type="tel"
                pattern="\+?\d{0,3}[\s\(\-]?([0-9]{2,3})[\s\)\-]?([\s\-]?)([0-9]{3})[\s\-]?([0-9]{2})[\s\-]?([0-9]{2})"
                placeholder="Enter your phone (e.g. +14155552675)" id="phone" class="input-field" required=""
                [readOnly]="isReadOnly()" formControlName="phone">
        </div>


        <hr class="border">
    </div>
    <div class="form-content">
        <p class="info-header">Sender Address</p>
        <div class="form-item">
            <label for="sender-street" class="u-label">Street</label>
            <input type="text" placeholder="Enter your street" id="sender-street" class="input-field" required
                [readOnly]="isReadOnly()" formControlName="senderStreet">
        </div>

        <div class="city-zip">
            <div class="form-item">
                <label for="sender-city" class="u-label">City</label>
                <input type="text" placeholder="Enter your city" id="sender-city" class="input-field"
                    [readOnly]="isReadOnly()" formControlName="senderCity">
            </div>

            <div class="form-item">
                <label for="sender-zip" class="u-label">Zip</label>
                <input type="text" placeholder="Enter your zip" id="sender-zip" class="input-field"
                    [readOnly]="isReadOnly()" formControlName="senderZip">
            </div>
        </div>

        @if(isInternational()){
        <div class="form-item">
            <label for="sender-country" class="u-label">Country</label>
            <select id="sender-country" class="select-field" required formControlName="senderCountry"
                [style.pointer-events]="isReadOnly() ? 'none' : 'auto'" [attr.tabindex]="isReadOnly() ? -1 : 0">
                <option value="" disabled hidden>Select Country</option>
                <option value="United States">United States</option>
            </select>
        </div>
        }



    </div>

    <div class="form-content">
        <p class="info-header">Receiver Information </p>
        <div class="sender-info-name">
            <div class="name-form">
                <label for="first-name" class="name-label">First Name</label>
                <input type="text" placeholder="Enter reciver First Name" id="first-name" class="input-field"
                    required="" [readOnly]="isReadOnly()" formControlName="receiverFirstName">
            </div>

            <div class="name-form">
                <label for="last-name" class="name-label">Last Name</label>
                <input type="text" placeholder="Enter reciver Last Name" id="last-name" class="input-field" required=""
                    [readOnly]="isReadOnly()" formControlName="receiverLastName">
            </div>
        </div>
        <div class="form-item">
            <label for="receiver-street" class="u-label">Street</label>
            <input type="text" placeholder="Enter your street" id="receiver-street" class="input-field" required
                [readOnly]="isReadOnly()" formControlName="receiverStreet">
        </div>

        <div class="city-zip">
            <div class="form-item">
                <label for="receiver-city" class="u-label">City</label>
                <input type="text" placeholder="Enter your city" id="receiver-city" class="input-field"
                    [readOnly]="isReadOnly()" formControlName="receiverCity">
            </div>

            <div class="form-item">
                <label for="receiver-zip" class="u-label">Zip</label>
                <input type="text" placeholder="Enter your zip" id="receiver-zip" class="input-field"
                    [readOnly]="isReadOnly()" formControlName="receiverZip">
            </div>
        </div>

        @if(isInternational()){
        <div class="form-item">
            <label for="receiver-country" class="u-label">Country</label>
            <select id="receiver-country" class="select-field" required formControlName="receiverCountry"
                [style.pointer-events]="isReadOnly() ? 'none' : 'auto'" [attr.tabindex]="isReadOnly() ? -1 : 0">
                <option value="" disabled hidden>Select Country</option>
                <option value="United States">United States</option>
            </select>
        </div>
        }

    </div>

    <div class="delivery-option">
        <label class="info-header">Delivery Option</label>
        <div class="delivery-option-item" [class.isReadOnlyRadio]="isReadOnly()">
            <input id="standard" type="radio" value="standard" class="option-item" formControlName="deliveryOption"
                [readOnly]="isReadOnly()">
            <label class="option-label" for="standard">Standard</label>
        </div>

        <div class="delivery-option-item" [class.isReadOnlyRadio]="isReadOnly()">
            <input id="express" type="radio" value="express" class="option-item" formControlName="deliveryOption"
                [readOnly]="isReadOnly()">
            <label class="option-label" for="express">Express</label>
        </div>
    </div>

    @if(isInternational()){
    <div class="delivery-purpose">
        <label class="info-header">Delivery Purpose</label>
        <div class="delivery-option-item" [class.isReadOnlyRadio]="isReadOnly()">
            <input id="gift" type="radio" value="gift" class="purpose-item" formControlName="deliveryPurpose"
                [readOnly]="isReadOnly()">
            <label class="purpose-label" for="gift">Gift</label>
        </div>

        <div class="delivery-option-item" [class.isReadOnlyRadio]="isReadOnly()">
            <input id="sales" type="radio" value="sales" class="purpose-item" formControlName="deliveryPurpose"
                [readOnly]="isReadOnly()">
            <label class="purpose-label" for="sales">Sales of goods</label>
        </div>
    </div>
    }
</form>
